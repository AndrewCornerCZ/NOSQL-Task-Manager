version: '3.9'

services:
  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: nextjs_app
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - redis

volumes:
  redis_data:
